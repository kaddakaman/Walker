<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16a34a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="Track your walks with GPS, keep a history and share routes." />
  <title>Walker</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1 id="title">Walker</h1>
  </header>

  <main>
    <!-- WALK -->
    <section id="view-walk" class="view active">
      <div class="map-wrap">
        <div id="map" class="map"></div>
        <button id="btn-recenter" class="map-btn" title="Centre on me" aria-label="Centre on me">◎</button>
      </div>

      <div id="guide" class="guide" hidden>
        <svg id="guide-arrow" class="guide-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L20 21 L12 16.5 L4 21 Z" fill="currentColor"/></svg>
        <div class="guide-text">
          <div id="guide-main" class="guide-main">Following route</div>
          <div id="guide-sub" class="guide-sub"></div>
        </div>
        <button id="btn-stop-guide" class="icon-btn" aria-label="Stop following">✕</button>
      </div>

      <div class="stats">
        <div class="stat"><span id="s-time" class="v">00:00</span><span class="l">Time</span></div>
        <div class="stat"><span id="s-dist" class="v">0 m</span><span class="l">Distance</span></div>
        <div class="stat"><span id="s-speed" class="v">0.0</span><span class="l">Avg km/h</span></div>
        <div class="stat"><span id="s-steps" class="v">0</span><span class="l">Steps</span></div>
      </div>

      <p id="gps-status" class="gps-status">Waiting for GPS…</p>
      <button id="btn-toggle" class="big-btn start">Start walk</button>
    </section>

    <!-- HISTORY -->
    <section id="view-history" class="view">
      <div id="history-summary" class="summary"></div>
      <ul id="history-list" class="list"></ul>
      <p id="history-empty" class="empty">No walks yet. Press <b>Start walk</b> to record your first one.</p>
    </section>

    <!-- ROUTES -->
    <section id="view-routes" class="view">
      <p class="hint">
        Routes friends share with you appear here. To share one of your own walks,
        open it in <b>History</b> and tap <b>Share</b>.
      </p>
      <label class="btn secondary file-btn">
        Import GPX file
        <input id="gpx-input" type="file" accept=".gpx,application/gpx+xml,application/xml,text/xml" hidden />
      </label>
      <ul id="routes-list" class="list"></ul>
      <p id="routes-empty" class="empty">No shared routes yet.</p>
    </section>
  </main>

  <!-- DETAIL (walk or route) -->
  <section id="detail" class="detail" hidden>
    <header class="topbar">
      <button id="btn-detail-back" class="icon-btn" aria-label="Back">‹</button>
      <h1 id="detail-title">Walk</h1>
      <button id="btn-rename" class="icon-btn" aria-label="Rename">✎</button>
    </header>
    <div class="detail-body">
      <p id="detail-date" class="muted"></p>
      <div id="detail-map" class="map detail-map"></div>
      <div id="detail-stats" class="stats"></div>
      <div class="actions">
        <button id="btn-follow" class="btn primary">Follow this route</button>
        <button id="btn-share" class="btn secondary">Share</button>
        <button id="btn-gpx" class="btn secondary">Export GPX</button>
        <button id="btn-delete" class="btn danger">Delete</button>
      </div>
    </div>
  </section>

  <nav class="tabs">
    <button data-view="walk" class="tab active"><span>🚶</span>Walk</button>
    <button data-view="history" class="tab"><span>🕑</span>History</button>
    <button data-view="routes" class="tab"><span>🗺️</span>Routes</button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="dialog">
    <form method="dialog">
      <h2 id="dialog-title"></h2>
      <p id="dialog-text"></p>
      <input id="dialog-input" type="text" hidden />
      <menu>
        <button value="cancel" id="dialog-cancel" class="btn secondary">Cancel</button>
        <button value="ok" id="dialog-ok" class="btn primary">OK</button>
      </menu>
    </form>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
